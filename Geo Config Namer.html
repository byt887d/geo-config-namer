<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><meta name="viewport" content="width=device-width"><title>Geo Config Namer</title><style>body{background:#0b1115;color:#e7efe9;font:15px system-ui;max-width:1000px;margin:auto;padding:35px 18px}h1{font-size:48px}b{color:#8bd3a6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#10181a;border:1px solid #294033;border-radius:20px;padding:18px}textarea,input{width:100%;box-sizing:border-box;background:#0b1115;color:white;border:1px solid #304739;border-radius:12px;padding:13px;margin:8px 0 15px}textarea{height:300px;font:12px monospace}button{background:#8bd3a6;border:0;border-radius:10px;padding:12px 15px;font-weight:bold;cursor:pointer}.result{padding:12px;margin:8px 0;border:1px solid #294033;border-radius:12px}.name{font:600 15px monospace}@media(max-width:700px){.grid{grid-template-columns:1fr}h1{font-size:38px}}</style><style>undefined</style><link rel="preconnect" href="https://fonts.googleapis.com/" crossorigin="use-credentials"><link rel="preconnect" href="https://fonts.gstatic.com/"><link rel="stylesheet" href="./Geo Config Namer_files/css2"></head><body><main dir="rtl"><small>GEO CONFIG NAMER · CLOUDFLARE WORKER</small><h1>نام‌گذاری واقعی،<br><b>بر اساس کشور IP</b></h1><p>آدرس Worker را وارد کن، بعد کانفیگ‌ها را هر کدام در یک خط بچسبان.</p><div class="grid"><section class="card"><label>آدرس Worker</label><input id="e" placeholder="https://your-worker.workers.dev"><label>کانفیگ‌ها</label><textarea id="c" placeholder="vless://..."></textarea><button onclick="run()">تشخیص کشور و نام‌گذاری</button><p id="s"></p></section><section class="card"><h2>خروجی</h2><div id="o">نتیجه اینجا می‌آید.</div></section></div></main><script>async function run(){let e=document.querySelector('#e').value.replace(/\/$/,''),c=document.querySelector('#c').value.split(/\n/).map(x=>x.trim()).filter(Boolean),s=document.querySelector('#s'),o=document.querySelector('#o');s.textContent='در حال بررسی...';try{let r=await fetch(e+'/api/name',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({configs:c})}),j=await r.json();if(!r.ok)throw Error(j.error);o.innerHTML=j.items.map(x=>`<div class=result><div class=name>${x.name}</div><small>IP: ${x.ip||'نامشخص'} · ${x.country} · ${x.host}</small></div>`).join('');s.textContent=j.items.length+' مورد آماده شد'}catch(x){s.textContent='خطا: '+x.message}}</script>
</body></html>
